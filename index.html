<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Our Memory Player</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #09090e, #131127, #240d34);
      --card-bg: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #a855f7;
      --accent-glow: rgba(168, 85, 247, 0.4);
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-gradient);
      color: var(--text-main);
      padding: 16px;
    }

    .player-card {
      width: 100%;
      max-width: 380px;
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--card-border);
      border-radius: 32px;
      padding: 24px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .top-bar span {
      font-size: 0.8rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
    }

    .top-bar-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    .art-container {
      width: 250px;
      height: 250px;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      margin-bottom: 20px;
      background: #111;
      border: 1px solid var(--card-border);
    }

    .art-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .track-info {
      text-align: center;
      width: 100%;
      margin-bottom: 16px;
    }

    .track-title {
      font-size: 1.25rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .track-artist {
      font-size: 0.9rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
      cursor: pointer;
    }

    .progress-section {
      width: 100%;
      margin-bottom: 16px;
    }

    .progress-slider {
      width: 100%;
      height: 5px;
    }

    .time-stamps {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      width: 100%;
      margin-bottom: 18px;
    }

    .play-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px var(--accent-glow);
      transition: transform 0.15s ease;
    }

    .play-btn:active {
      transform: scale(0.92);
    }

    .volume-container {
      width: 80%;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-muted);
    }

    .volume-slider {
      flex: 1;
      height: 4px;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 16px;
    }

    .modal {
      background: #16122e;
      border: 1px solid var(--card-border);
      border-radius: 24px;
      width: 100%;
      max-width: 360px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .form-group input {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--accent);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <div class="player-card">
    <div class="top-bar">
      <span>Our Memories</span>
      <div class="top-bar-actions">
        <button class="icon-btn" id="deleteTrackBtn" title="Remove Track">
          <i data-lucide="trash-2" style="width: 20px; height: 20px;"></i>
        </button>
        <button class="icon-btn" id="openModalBtn" title="Add Track">
          <i data-lucide="plus-circle" style="width: 22px; height: 22px;"></i>
        </button>
      </div>
    </div>

    <div class="art-container">
      <img id="coverArt" src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=500" alt="Memory Photo" loading="lazy" />
    </div>

    <div class="track-info">
      <div class="track-title" id="trackTitle">Loading songs...</div>
      <div class="track-artist" id="trackArtist">...</div>
    </div>

    <audio id="audioPlayer" preload="metadata" playsinline webkit-playsinline></audio>

    <div class="progress-section">
      <input type="range" id="progressBar" class="progress-slider" value="0" min="0" max="100" />
      <div class="time-stamps">
        <span id="currentTime">0:00</span>
        <span id="durationTime">0:00</span>
      </div>
    </div>

    <div class="controls">
      <button class="icon-btn" id="prevBtn"><i data-lucide="skip-back" style="width: 26px; height: 26px;"></i></button>
      <button class="play-btn" id="playBtn"><i data-lucide="play" id="playIcon" style="width: 24px; height: 24px; margin-left: 2px;"></i></button>
      <button class="icon-btn" id="nextBtn"><i data-lucide="skip-forward" style="width: 26px; height: 26px;"></i></button>
    </div>

    <div class="volume-container">
      <i data-lucide="volume-2" style="width: 16px; height: 16px;"></i>
      <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.8" />
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3 style="font-size: 1.15rem;">Add Memory Song</h3>
      
      <div class="form-group">
        <label>Song / Memory Title</label>
        <input type="text" id="inputTitle" placeholder="e.g. Midnight Drive" required />
      </div>

      <div class="form-group">
        <label>Artist</label>
        <input type="text" id="inputArtist" placeholder="e.g. Bir Singh" required />
      </div>

      <div class="form-group">
        <label>Memory Photo (JPG/PNG)</label>
        <input type="file" id="inputFileCover" accept="image/jpeg,image/png,image/webp,image/*" required />
      </div>

      <div class="form-group">
        <label>Audio File (MP3/M4A/WAV)</label>
        <input type="file" id="inputFileAudio" accept="audio/mpeg,audio/mp3,audio/wav,audio/m4a,audio/x-m4a,audio/*" required />
      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancelModalBtn">Cancel</button>
        <button class="btn btn-primary" id="saveTrackBtn">Upload</button>
      </div>
    </div>
  </div>

  <script>
    const defaultPlaylist = [
      { title: "Iko Rang", artist: "Bir Singh", cover: "photo2.jpeg", audio: "ikkorang.mp3" },
      { title: "First Love", artist: "Garry Sandhu", cover: "photo1.jpeg", audio: "fl.mp3" },
      { title: "He is Mine", artist: "Arjan", cover: "photo13.jpeg", audio: "mine.mp3" },
      { title: "Do Gallan", artist: "Garry Sandhu", cover: "photo17.jpeg", audio: "dg.mp3" },
      { title: "Reshmi Road", artist: "Hustinder", cover: "photo15.jpeg", audio: "rr.mp3" },
      { title: "Coffee", artist: "Amrinder Gill", cover: "photo16.jpeg", audio: "coffee.mp3" },
      { title: "7 Lives", artist: "Tarsem Jassar", cover: "photo14.jpeg", audio: "7lives.mp3" },
      { title: "Taaz", artist: "Navan Sandhu", cover: "photo18.jpeg", audio: "taaz.mp3" },
      { title: "US", artist: "SMW", cover: "photo3.jpeg", audio: "us.mp3" },
      { title: "Karan Aujla", artist: "Admiring You", cover: "photo9.jpeg", audio: "au.mp3" },
      { title: "Udeekan Vich", artist: "Arman Bedil", cover: "photo20.jpg", audio: "UdV.mp3" },
      { title: "Teri ho gayee haan", artist: "Milind Gaba", cover: "IMG_7022.jpeg", audio: "Main Teri Ho Gayi Millind Gaba 320 Kbps.mp3" },
      { title: "Hear Me calling", artist: "Gill boiz", cover: "IMG_7004.png", audio: "HEAR ME CALLING(KoshalWorld.Com).mp3" },
      { title: "WRITTEN BEAUTIFULLY", artist: "Jordan Sandhu", cover: "IMG_7032.jpeg", audio: "Written Beautifully - Jordan Sandhu (Mr-Punjab.Com).mp3" },
      { title: "Khadoos", artist: "Jassar", cover: "eb1c9e1a-90f9-4ed9-8c96-2a7876f3739b.jpeg", audio: "Khadoos.mp3" },
      { title: "Pariyan", artist: "Landers", cover: "IMG_7041.png", audio: "Pariyan - The Landers.mp3" },
      { title: "Wallpaper", artist: "Navjeet", cover: "IMG_7031.png", audio: "Navjeet_-_Wallpaper_(mp3.pm).mp3" },
      { title: "Adore", artist: "Anrinder Gill", cover: "IMG_7044.png", audio: "Adore.mp3" }
    ];

    const formattedDefaultPlaylist = defaultPlaylist.map((track, i) => ({
      id: `default_${i}`,
      isDefault: true,
      title: track.title,
      artist: track.artist,
      cover_url: track.cover,
      audio_url: track.audio
    }));

    const SUPABASE_URL = "https://uzwlwkbpqfjsrjhsxott.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV6d2x3a2JwcWZqc3JqaHN4b3R0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNjUwOTgsImV4cCI6MjEwMzg0MTA5OH0.ZPV0yshmaULUmfnNLvysLyr_w6gEf2oUkDNft1HO4Gs";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let playlist = [...formattedDefaultPlaylist];
    let currentIndex = 0;
    let isPlaying = false;

    const audio = document.getElementById("audioPlayer");
    const trackTitle = document.getElementById("trackTitle");
    const trackArtist = document.getElementById("trackArtist");
    const coverArt = document.getElementById("coverArt");
    const playBtn = document.getElementById("playBtn");
    const playIcon = document.getElementById("playIcon");
    const progressBar = document.getElementById("progressBar");
    const currentTimeEl = document.getElementById("currentTime");
    const durationTimeEl = document.getElementById("durationTime");
    const volumeSlider = document.getElementById("volumeSlider");

    const modalOverlay = document.getElementById("modalOverlay");
    const openModalBtn = document.getElementById("openModalBtn");
    const cancelModalBtn = document.getElementById("cancelModalBtn");
    const saveTrackBtn = document.getElementById("saveTrackBtn");
    const deleteTrackBtn = document.getElementById("deleteTrackBtn");

    function initLucide() {
      lucide.createIcons();
    }
    initLucide();

    function formatTime(seconds) {
      if (isNaN(seconds) || !isFinite(seconds)) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function renderTrack(index, autoPlay = false) {
      if (playlist.length === 0) {
        trackTitle.textContent = "No tracks available";
        trackArtist.textContent = "";
        return;
      }
      if (index >= playlist.length) currentIndex = 0;
      if (index < 0) currentIndex = playlist.length - 1;

      const item = playlist[currentIndex];
      trackTitle.textContent = item.title;
      trackArtist.textContent = item.artist;
      coverArt.src = item.cover_url;
      audio.src = item.audio_url;

      progressBar.value = 0;
      currentTimeEl.textContent = "0:00";
      durationTimeEl.textContent = "0:00";

      if (autoPlay) {
        audio.play().then(() => {
          isPlaying = true;
          updatePlayBtn();
        }).catch(err => {
          console.warn("Autoplay blocked by iOS browser:", err);
          isPlaying = false;
          updatePlayBtn();
        });
      } else {
        isPlaying = false;
        updatePlayBtn();
      }
    }

    function updatePlayBtn() {
      playIcon.setAttribute("data-lucide", isPlaying ? "pause" : "play");
      playIcon.style.marginLeft = isPlaying ? "0px" : "2px";
      initLucide();
    }

    playBtn.addEventListener("click", () => {
      if (playlist.length === 0) return;
      if (audio.paused) {
        audio.play().then(() => {
          isPlaying = true;
          updatePlayBtn();
        }).catch(err => console.error("Playback error:", err));
      } else {
        audio.pause();
        isPlaying = false;
        updatePlayBtn();
      }
    });

    audio.addEventListener("timeupdate", () => {
      if (!isNaN(audio.duration) && audio.duration > 0) {
        progressBar.value = (audio.currentTime / audio.duration) * 100;
        currentTimeEl.textContent = formatTime(audio.currentTime);
      }
    });

    audio.addEventListener("loadedmetadata", () => {
      durationTimeEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener("ended", () => {
      currentIndex = (currentIndex + 1) % playlist.length;
      renderTrack(currentIndex, true);
    });

    progressBar.addEventListener("input", () => {
      if (!isNaN(audio.duration) && audio.duration > 0) {
        audio.currentTime = (progressBar.value / 100) * audio.duration;
      }
    });

    volumeSlider.addEventListener("input", (e) => {
      audio.volume = e.target.value;
    });

    document.getElementById("prevBtn").addEventListener("click", () => {
      if (playlist.length === 0) return;
      currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
      renderTrack(currentIndex, isPlaying);
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
      if (playlist.length === 0) return;
      currentIndex = (currentIndex + 1) % playlist.length;
      renderTrack(currentIndex, isPlaying);
    });

    deleteTrackBtn.addEventListener("click", async () => {
      if (playlist.length === 0) return;

      const track = playlist[currentIndex];
      const confirmDelete = confirm(`Delete "${track.title}"?`);
      if (!confirmDelete) return;

      if (track.isDefault) {
        playlist.splice(currentIndex, 1);
        renderTrack(currentIndex, false);
        return;
      }

      try {
        await supabaseClient.from('tracks').delete().eq('id', track.id);
        await fetchTracks();
      } catch (err) {
        alert("Failed to delete: " + err.message);
      }
    });

    openModalBtn.addEventListener("click", () => modalOverlay.style.display = "flex");
    cancelModalBtn.addEventListener("click", () => modalOverlay.style.display = "none");

    saveTrackBtn.addEventListener("click", async () => {
      const title = document.getElementById("inputTitle").value.trim();
      const artist = document.getElementById("inputArtist").value.trim();
      const coverFile = document.getElementById("inputFileCover").files[0];
      const audioFile = document.getElementById("inputFileAudio").files[0];

      if (!title || !artist || !coverFile || !audioFile) {
        alert("Please complete all fields and choose both photo and audio files.");
        return;
      }

      saveTrackBtn.textContent = "Uploading...";
      saveTrackBtn.disabled = true;

      try {
        const cleanName = (name) => name.replace(/[^a-zA-Z0-9._-]/g, '_');
        
        // Upload cover
        const coverName = `${Date.now()}_${cleanName(coverFile.name)}`;
        const { error: coverErr } = await supabaseClient.storage.from('song-cover').upload(coverName, coverFile, {
          cacheControl: '3600',
          upsert: true
        });
        if (coverErr) throw coverErr;
        const { data: coverUrlData } = supabaseClient.storage.from('song-cover').getPublicUrl(coverName);

        // Upload audio
        const audioName = `${Date.now()}_${cleanName(audioFile.name)}`;
        const { error: audioErr } = await supabaseClient.storage.from('songs').upload(audioName, audioFile, {
          cacheControl: '3600',
          upsert: true
        });
        if (audioErr) throw audioErr;
        const { data: audioUrlData } = supabaseClient.storage.from('songs').getPublicUrl(audioName);

        // Save row
        const { error: dbErr } = await supabaseClient.from('tracks').insert([{
          title,
          artist,
          cover_url: coverUrlData.publicUrl,
          audio_url: audioUrlData.publicUrl
        }]);
        if (dbErr) throw dbErr;

        modalOverlay.style.display = "none";
        document.getElementById("inputTitle").value = "";
        document.getElementById("inputArtist").value = "";
        document.getElementById("inputFileCover").value = "";
        document.getElementById("inputFileAudio").value = "";

        await fetchTracks();
        currentIndex = playlist.length - 1;
        renderTrack(currentIndex, true);
      } catch (err) {
        alert("Upload error: " + err.message);
      } finally {
        saveTrackBtn.textContent = "Upload";
        saveTrackBtn.disabled = false;
      }
    });

    async function fetchTracks() {
      try {
        const { data, error } = await supabaseClient
          .from('tracks')
          .select('*')
          .order('id', { ascending: true });

        if (!error && data && data.length > 0) {
          const supabaseTracks = data.map(t => ({ ...t, isDefault: false }));
          playlist = [...formattedDefaultPlaylist, ...supabaseTracks];
        } else {
          playlist = [...formattedDefaultPlaylist];
        }
      } catch (err) {
        playlist = [...formattedDefaultPlaylist];
      }
      renderTrack(currentIndex, false);
    }

    fetchTracks();
  </script>
</body>
</html>
