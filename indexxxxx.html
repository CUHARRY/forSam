<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Memory Player</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.15);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #a855f7;
      --accent-hover: #c084fc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-gradient);
      color: var(--text-main);
      padding: 20px;
    }

    .player-card {
      width: 100%;
      max-width: 400px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .top-bar span {
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, color 0.15s ease;
    }

    .icon-btn:hover {
      color: var(--accent);
      transform: scale(1.1);
    }

    .art-container {
      width: 240px;
      height: 240px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
      margin-bottom: 20px;
      background: #111;
      border: 1px solid var(--card-border);
    }

    .art-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .track-info {
      text-align: center;
      width: 100%;
      margin-bottom: 14px;
    }

    .track-title {
      font-size: 1.25rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .track-artist {
      font-size: 0.95rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .spotify-frame-wrap {
      width: 100%;
      height: 80px;
      margin-bottom: 16px;
      border-radius: 12px;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
      width: 100%;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 16px;
    }

    .modal {
      background: #1e1b4b;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .form-group input {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--accent);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <div class="player-card">
    <div class="top-bar">
      <span>Our Playlist</span>
      <button class="icon-btn" id="openModalBtn" title="Add Track">
        <i data-lucide="plus-circle"></i>
      </button>
    </div>

    <div class="art-container">
      <img id="coverArt" src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=500" alt="Memory Photo" />
    </div>

    <div class="track-info">
      <div class="track-title" id="trackTitle">Loading memory...</div>
      <div class="track-artist" id="trackArtist">...</div>
    </div>

    <!-- Spotify Embed Player -->
    <div class="spotify-frame-wrap">
      <iframe id="spotifyPlayer" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>

    <div class="controls">
      <button class="icon-btn" id="prevBtn">
        <i data-lucide="skip-back" style="width: 28px; height: 28px;"></i>
      </button>
      <button class="icon-btn" id="nextBtn">
        <i data-lucide="skip-forward" style="width: 28px; height: 28px;"></i>
      </button>
    </div>
  </div>

  <!-- Add Memory Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3>Add a Song & Memory</h3>
      <div class="form-group">
        <label>Song Title / Memory Note</label>
        <input type="text" id="inputTitle" placeholder="e.g. Our First Roadtrip" required />
      </div>
      <div class="form-group">
        <label>Artist</label>
        <input type="text" id="inputArtist" placeholder="Artist Name" required />
      </div>
      <div class="form-group">
        <label>Spotify Track URL</label>
        <input type="url" id="inputSpotify" placeholder="https://open.spotify.com/track/..." required />
      </div>
      <div class="form-group">
        <label>Couple Memory Photo</label>
        <input type="file" id="inputFileCover" accept="image/*" required />
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancelModalBtn">Cancel</button>
        <button class="btn btn-primary" id="saveTrackBtn">Upload & Save</button>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    // === Supabase Configuration ===
    const SUPABASE_URL = "https://uzwlwkbpqfjsrjhsxott.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV6d2x3a2JwcWZqc3JqaHN4b3R0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNjUwOTgsImV4cCI6MjEwMzg0MTA5OH0.ZPV0yshmaULUmfnNLvysLyr_w6gEf2oUkDNft1HO4Gs";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let playlist = [];
    let currentIndex = 0;

    const trackTitle = document.getElementById("trackTitle");
    const trackArtist = document.getElementById("trackArtist");
    const coverArt = document.getElementById("coverArt");
    const spotifyPlayer = document.getElementById("spotifyPlayer");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const openModalBtn = document.getElementById("openModalBtn");
    const cancelModalBtn = document.getElementById("cancelModalBtn");
    const saveTrackBtn = document.getElementById("saveTrackBtn");
    const modalOverlay = document.getElementById("modalOverlay");

    function formatSpotifyEmbed(url) {
      if (!url) return "";
      const match = url.match(/track\/([a-zA-Z0-9]+)/);
      return match ? `https://open.spotify.com/embed/track/${match[1]}?utm_source=generator&theme=0` : url;
    }

    function renderTrack(index) {
      if (playlist.length === 0) {
        trackTitle.textContent = "No tracks yet";
        trackArtist.textContent = "Tap + to add your first memory";
        return;
      }
      const item = playlist[index];
      trackTitle.textContent = item.title;
      trackArtist.textContent = item.artist;
      coverArt.src = item.cover_url;
      spotifyPlayer.src = formatSpotifyEmbed(item.spotify_url);
    }

    async function fetchTracks() {
      const { data, error } = await supabaseClient
        .from('tracks')
        .select('*')
        .order('id', { ascending: true });

      if (!error && data && data.length > 0) {
        playlist = data;
        currentIndex = 0;
        renderTrack(currentIndex);
      } else {
        renderTrack(0);
      }
    }

    prevBtn.addEventListener("click", () => {
      if (playlist.length > 0) {
        currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
        renderTrack(currentIndex);
      }
    });

    nextBtn.addEventListener("click", () => {
      if (playlist.length > 0) {
        currentIndex = (currentIndex + 1) % playlist.length;
        renderTrack(currentIndex);
      }
    });

    openModalBtn.addEventListener("click", () => modalOverlay.style.display = "flex");
    cancelModalBtn.addEventListener("click", () => modalOverlay.style.display = "none");

    saveTrackBtn.addEventListener("click", async () => {
      const title = document.getElementById("inputTitle").value.trim();
      const artist = document.getElementById("inputArtist").value.trim();
      const spotifyUrl = document.getElementById("inputSpotify").value.trim();
      const file = document.getElementById("inputFileCover").files[0];

      if (!title || !artist || !spotifyUrl || !file) {
        alert("Please fill all fields and select a photo!");
        return;
      }

      saveTrackBtn.textContent = "Uploading...";
      saveTrackBtn.disabled = true;

      try {
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;

        const { error: uploadError } = await supabaseClient.storage
          .from('song-cover')
          .upload(fileName, file);

        if (uploadError) throw uploadError;

        const { data: publicUrlData } = supabaseClient.storage
          .from('song-cover')
          .getPublicUrl(fileName);

        const { error: insertError } = await supabaseClient
          .from('tracks')
          .insert([{
            title,
            artist,
            spotify_url: spotifyUrl,
            cover_url: publicUrlData.publicUrl
          }]);

        if (insertError) throw insertError;

        modalOverlay.style.display = "none";
        document.getElementById("inputTitle").value = "";
        document.getElementById("inputArtist").value = "";
        document.getElementById("inputSpotify").value = "";
        document.getElementById("inputFileCover").value = "";

        await fetchTracks();
        currentIndex = playlist.length - 1;
        renderTrack(currentIndex);
      } catch (err) {
        alert("Failed to save: " + err.message);
      } finally {
        saveTrackBtn.textContent = "Upload & Save";
        saveTrackBtn.disabled = false;
      }
    });

    fetchTracks();
  </script>
</body>
</html>
